[package]
edition = "2021"
rust-version = "1.65"
name = "monero-clsag"
version = "0.1.0"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The CLSAG linkable ring signature, as defined by the Monero protocol"
readme = "README.md"
license = "MIT"
repository = "https://github.com/monero-oxide/monero-oxide/tree/main/monero-oxide/ringct/clsag"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
compile-time-generators = ["curve25519-dalek/precomputed-tables"]
# shlosilo: transitional alloc fallback (boxed error payloads, Vec cold
# paths). Zero-heap builds disable it and take the fixed-cap/cfg arms.
alloc-fallback = ["curve25519-dalek/alloc-fallback", "curve25519-dalek/alloc"]
default = [
    "std",
    "compile-time-generators",
    "alloc-fallback",
]
multisig = [
    "rand_chacha",
    "transcript",
    "group",
    "dalek-ff-group",
    "frost",
    "std",
]
std = [
    "std-shims/std",
    "thiserror/std",
    "rand_core/std",
    "zeroize/std",
    "subtle/std",
    "rand_chacha?/std",
    "group?/alloc",
    "monero-io/std",
    "monero-ed25519/std",
]

[lib]
name = "monero_clsag"
path = "src/lib.rs"

[dependencies.curve25519-dalek]
version = "4"
features = [
    "zeroize",
]
default-features = false

[dependencies.dalek-ff-group]
version = "0.5"
optional = true
default-features = false

[dependencies.frost]
version = "0.11"
