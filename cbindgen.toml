language = "c"
header = """/* shlosilo C-ABI — generated by cbindgen, do not edit by hand */

/*
 * The C host must provide these three hooks; the shlosilo staticlib links
 * against them (they live in flux/forgebox/staticlib, the C-host runtime
 * bundle, not in the forms core):
 *
 *   void  *shlosilo_embedded_malloc(size_t size);       // allocator backend
 *   void   shlosilo_embedded_free(void *ptr);
 *   void   shlosilo_panic_hook(const uint8_t *msg, size_t len);  // never returns
 *
 * The ForgeBox firmware implements them in shlosilo/embedded_alloc_glue.c
 * and src/tasks/shlosilo_smoke_task.c.
 */"""

# Task 5a: the flux-side keysource QR scan-flow glue lives in the
# `shlosilo-flux-keysource` crate (flux/keysource) — `cbindgen --crate shlosilo`
# parses the forms core only and can never see it, so its C declarations ride
# the trailer below (byte-equal header gate stays honest: everything in
# shlosilo.h is still produced by cbindgen). Keep in sync with
# flux/keysource/src/keysource/ffi.rs (SAFETY + workspace contract docs live
# there). 5b (C product flow) may move these into a dedicated header.
# NOTE: `trailer` is a TOP-LEVEL key — after any [section] header TOML would
# file it under that table.
trailer = """/*
 * Task 5a — flux/keysource QR scan-flow glue (scan bytes in, session pointer
 * out). Workspace contract (same shape as the R3 handle workspaces): the
 * caller provides `shlosilo_keysource_qr_ws_len()` ZERO-INITIALIZED bytes in a
 * static / task workspace at a stable address (pinned until close); one live
 * session per workspace; close before discarding the workspace.
 *
 * Two-model boundary: sessions obtained here are closed by
 * `shlosilo_keysource_qr_close_ffi` ONLY — never through
 * `shlosilo_session_free_ffi` (that would drop the slot-owned session behind
 * the live handle's back).
 *
 * `shlosilo_keysource_qr_open_ffi` return codes: 0 = Ok (*out_session receives
 * the live session pointer, valid until close), -2 = NULL argument, -20 =
 * ws_len under capacity, -23 = a session is already live in this workspace,
 * otherwise the seed_qr::decode / from_entropy L2b error codes.
 */
unsigned int shlosilo_keysource_qr_ws_len(void);

int shlosilo_keysource_qr_open_ffi(uint8_t *ws,
                                   unsigned int ws_len,
                                   const uint8_t *data,
                                   unsigned int data_len,
                                   const struct KeySession **out_session);

int shlosilo_keysource_qr_close_ffi(uint8_t *ws);

/*
 * Task 8 — flux/keysource SE password-unlock glue (password in, session
 * pointer out). Same workspace contract as the QR glue above — and the SAME
 * teardown: `shlosilo_keysource_se_close_ffi` and
 * `shlosilo_keysource_qr_close_ffi` are one shared close, so a workspace
 * opened by either open entry closes through either close entry.
 *
 * `shlosilo_keysource_se_open_ffi` return codes: 0 = Ok (*out_session
 * receives the live session pointer, valid until close), -2 = NULL argument,
 * -20 = ws_len under capacity, -23 = a session is already live in this
 * workspace (refused BEFORE any password attempt), -24 = auth failed (empty /
 * over-long / wrong password; one attempt, never retried), -25 = secure
 * element communication failure, otherwise the keystore/from_entropy L2b
 * error codes (e.g. -31: the untrusted entropyLen byte was not 16/32).
 *
 * Password: `password`/`password_len` bytes (not necessarily NUL-terminated).
 * The password never outlives the call; seed/entropy never appears in any
 * signature. v1 unlocks account 0 only.
 */
unsigned int shlosilo_keysource_se_ws_len(void);

int shlosilo_keysource_se_open_ffi(uint8_t *ws,
                                   unsigned int ws_len,
                                   const uint8_t *password,
                                   unsigned int password_len,
                                   const struct KeySession **out_session);

int shlosilo_keysource_se_close_ffi(uint8_t *ws);"""

[parse]
parse_deps = false

[export]
# Audit #5 engineering-3: FFI contract surface whitelist — export only the entry points the C host actually calls.
include = [
  "shlosilo_sign_ffi",
  "shlosilo_sign_ur_ffi",
  "shlosilo_sign_typed_ffi",
  "shlosilo_sign_session_ffi",
  "shlosilo_session_free_ffi",
  "shlosilo_seed_qr_probe_ffi",
  "shlosilo_export_readonly_ffi",
  "shlosilo_create_account_ffi",
  "shlosilo_supported_networks_ffi",
  "shlosilo_supported_protocols_ffi",
  "shlosilo_version",
  "shlosilo_cabi_version",
  "shlosilo_cabi_check",
  "shlosilo_ur_encode_begin",
  "shlosilo_ur_encode_next",
  "shlosilo_ur_encode_next_cyclic",
  "shlosilo_ur_encode_free",
  "shlosilo_ur_decode_new",
  "shlosilo_ur_decode_feed",
  "shlosilo_ur_decode_progress",
  "shlosilo_ur_decode_complete",
  "shlosilo_ur_decode_payload",
  "shlosilo_ur_decode_type",
  "shlosilo_ur_decode_uri_ffi",
  "shlosilo_ur_decode_free",
]
# Same-named constants across multiple mods (crate-internal implementation details, not needed on the C contract surface).
# exclude resolves the conflicts (old behavior: the generator exits 0 but the output was incomplete / full of ERRORs).
exclude = [
  "REDEEM_SCRIPT",
  "WITNESS_SCRIPT",
  "BIP32_DERIVATION",
  "TAP_INTERNAL_KEY",
  "SIGHASH_ALL",
  "SCALAR_LEN",
  "COMPRESSED_POINT_LEN",
]
