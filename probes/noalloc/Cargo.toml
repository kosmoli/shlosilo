[package]
name = "z6-noalloc-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Z6 link probe (deliberately OUTSIDE the workspace like fuzz/): a bare-metal
# staticlib that reaches the full sign paths and is linked against a C main
# with NO allocator. Any reachable allocation breaks the link with an
# undefined `__rust_alloc*` — that failure IS the audit instrument.

[features]
# Two faces (see README.md):
#  * default = lang-stub + alloc-face: the REACHABLE measurement face —
#    shlosilo in its normal shape; measure.py proves the signing entry
#    never calls the allocator (disassembly).
#  * `--no-default-features` (lang-stub off, alloc-face off): the GRAPH
#    probe — shlosilo without alloc-fallback; rustc's
#    "no global memory allocator found" reports the crate-graph debt.
default = ["lang-stub", "alloc-face"]
lang-stub = []
alloc-face = ["shlosilo/alloc-fallback"]

[lib]
path = "probe.rs"
crate-type = ["staticlib"]

[dependencies]
# Same shape as the forgebox staticlib dep: no default features, no
# alloc-fallback — the zero-heap claim under test.
shlosilo = { path = "../..", default-features = false }  # alloc-face turns on std+alloc-fallback
zeroize = { version = "1", default-features = false }
rand_core = { version = "0.6", default-features = false }

# Mirror the parent workspace's [patch.crates-io] (separate workspace root).
[patch.crates-io]
curve25519-dalek = { path = "../../vendor/curve25519-dalek" }
rqrr = { path = "../../vendor/rqrr" }
g2p = { path = "../../vendor/g2p" }
g2poly = { path = "../../vendor/g2poly" }
quircs = { path = "../../vendor/quircs" }
monero-clsag = { path = "../../vendor/monero-clsag" }
# Mirror parent: the vendored de-alloc copies (see root Cargo.toml comment).
monero-ed25519 = { path = "../../vendor/monero-ed25519" }
monero-io = { path = "../../vendor/monero-io" }
monero-bulletproofs-generators = { path = "../../vendor/monero-bulletproofs-generators" }
# Mirror parent: vendored base58 (visibility-only patch, see root comment).
base58-monero = { path = "../../vendor/base58-monero" }
std-shims = { path = "../../vendor/std-shims" }
