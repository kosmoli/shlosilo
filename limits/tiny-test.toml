# Platform resource profile: tiny-test
# Source of truth for the resource knobs. Runtime setters clamp to these
# ceilings; anything that sizes a stack array is fixed here at build time.
[limits]
bt_tx_inputs_max = 2  # BTC PSBT inputs the wire model holds (hard cap; over-cap -> BufferTooSmall)
bt_tx_outputs_max = 2  # BTC PSBT outputs the wire model holds
ur_ws_decoded_slots = 8  # UR fountain decoded-part slots (1 per part; part domain bound)
ur_ws_buffer_slots = 8  # UR fountain work-buffer slots
ur_ws_queue_slots = 8  # UR fountain cascade-queue slots
ur_ws_received_slots = 32  # UR received-sequence slots (fountain sequence space)
ur_payload_max = 1920  # <= decoded_slots x 240 B (the assembler's own bound)
sign_ws_bp_chunk_max = 4  # BP+ multiexp chunk terms ceiling (runtime knob clamps to this)
pairing_records_max = 4  # XMR pairing: key-image records per response (mirrors the Rust ceiling)
c_header = 0  # 1 = also emit the C projection header (only the C-driven carrier needs it)
psram_budget_bytes = 262144  # heap the workspaces may use at peak
stack_budget_bytes = 32768  # task/thread stack the carrier grants
xmr_inputs_max = 4  # XMR inputs the signer's fixed tables hold (stack-sized until phase 4a lands)
ur_encode_fragment_len = 64  # outbound UR fragment (bytes of payload per frame)
ur_inbound_fragment_max = 64  # arena slot width; measured peer value = 80 B (Sparrow, 2026-11-17), Keystone default 200
ur_source_fragments_max = 32  # source fragments per session (u16 domain)
review_lines_max = 8  # review-page rows (paging budget; a 43-input PSBT needs > 16)
