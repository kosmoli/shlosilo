# Platform resource profile: forgebox
# Source of truth for the resource knobs. Runtime setters clamp to these
# ceilings; anything that sizes a stack array is fixed here at build time.
#
# RESOURCE CEILINGS ONLY (chain axis design note, L1): which chains a build carries is
# a BUILD DECLARATION, never a property of a resource profile - see builds/<name>.toml
# (a `[chains]` table of btc/eth/xmr flags) and scripts/build_declared.sh. Do not grow
# that section back here: one profile per chain subset would duplicate every number
# below and couple two orthogonal axes; build.rs refuses the section outright.
[limits]
bt_tx_inputs_max = 64  # BTC PSBT inputs the wire model holds (hard cap; over-cap -> BufferTooSmall)
bt_tx_outputs_max = 64  # BTC PSBT outputs the wire model holds
ur_ws_decoded_slots = 256  # UR fountain decoded-part slots (1 per part; part domain bound)
ur_ws_buffer_slots = 256  # UR fountain work-buffer slots
ur_ws_queue_slots = 256  # UR fountain cascade-queue slots
ur_ws_received_slots = 4096  # UR received-sequence slots (fountain sequence space)
ur_payload_max = 61440  # Inbound UR payload bytes (keep <= slots x max sender fragment)
sign_ws_bp_chunk_max = 36  # BP+ multiexp chunk terms ceiling (runtime knob clamps to this)
sign_bp_chunk_terms = 8  # BP+ multiexp chunk terms this carrier asks for (per-call value on the straus scratch; <= sign_ws_bp_chunk_max). Tables now live in the carrier's internal SRAM (product_task.c g_bp_scratch), and the scratch demand is what bounds this number: storage_bytes(8) = 8*(16*160) + 8*256 + 64 = 22,592 B, the largest tier that still keeps .bss below the QR decode pool window at QR_POOL_SRAM_ADDR = 0x20084000 (16 terms = 45,120 B overlapped it and the scan-page guard refused to start the camera).
pairing_records_max = 128  # XMR pairing: key-image records per response (mirrors the Rust ceiling)
c_header = 1  # 1 = also emit the C projection header (only the C-driven carrier needs it)
psram_budget_bytes = 8384512  # heap the workspaces may use at peak
stack_budget_bytes = 196608  # task/thread stack the carrier grants
xmr_inputs_max = 16  # XMR inputs the signer's fixed tables hold (stack-sized until phase 4a lands)
ur_encode_fragment_len = 200  # outbound UR fragment (bytes of payload per frame)
ur_inbound_fragment_max = 256  # arena slot width; measured peer value = 80 B (Sparrow, 2026-11-17), Keystone default 200
ur_source_fragments_max = 1024  # source fragments per session (u16 domain)
review_lines_max = 32  # review-page rows (paging budget; a 43-input PSBT needs > 16)
eip712_types_max = 8  # EIP-712 type-table entries a request may declare (measured peak 4, Seaport)
eip712_type_fields_max = 16  # fields one EIP-712 type may declare (measured peak 11, OrderComponents)
eip712_name_bytes = 32  # bytes in one type name, field name or field type string (measured peak 20, identifierOrCriteria)
eip712_depth_max = 8  # nesting levels of the typed-data value tree (measured peak 3)
eip712_nodes_max = 256  # value-tree nodes: one per struct, array and atom (measured 6..104; 310 for a 3+40 batch, refused by policy)
eip712_encode_type_bytes = 512  # encodeType expansion bytes (measured peak 450, Seaport)
eip712_arena_bytes = 4096  # decoded name/string-value bytes (an unescaped name borrows the wire and costs no arena)
eip712_display_bytes = 2048  # review-page formatted-value scratch (addresses, decimal uints, the value-tree walk)
