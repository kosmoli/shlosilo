[package]
name = "shlosilo"
version = "0.5.0"
edition = "2021"

# shlosilo-poc4: Phase 2.0 + Phase 4 real algorithms (encoding + crypto primitives) — native target
#
# Phase 4 v2: self-implemented base58 + bech32 (v2 §3.5 zero-heap-allocation principle)
#
# Scope:
#   - five-layer directory structure (types / derivation / entropy / business)
#   - error code system (error.rs)
#   - Network enum + ChainKind enum
#   - Mnemonic struct + WordCount enum
#   - DerivationPath struct
#   - 4 business function signatures (unimplemented!() stubs)
#
# Out of scope (deferred to Phase 2.1 / 2.2 / 2.3 in later sessions):
#   - Layer A/B/C/D/E five stub module layers (crypto / signature / address / ur codec)
#   - sr25519 / cosmos / polkadot new files (only real implementation at Phase 8+)
#   - L2a / L2b / L3 imperative shell
#   - real algorithms (Phase 4)
#
# Difference from shlosilo-poc3: poc3 is a thumbv7em-none-eabihf embedded target + staticlib,
# poc4 is a native target + rlib, dedicated to cargo check for Phase 2.0 compile verification.

[workspace]
# Monorepo: the root crate is the `forms` core; flux appearances live under
# flux/. pico2 is a Rust-native appearance (it owns its runtime + embassy);
# forgebox's CMake/build.sh flow consumes the staticlib bundled by its
# staticlib/ shim package.
# vendor/* and fuzz/ stay standalone: vendor is third-party patched code (kept
# out of workspace lint gates, as before the workspace existed); fuzz is a
# cargo-fuzz crate with its own lockfile.
members = [
    "flux/pico2",
    "flux/forgebox/staticlib",
    "flux/host-sim/staticlib",
    # flux-side key acquisition face (KeySource trait + QrKeySource): shared
    # flux infrastructure, host-testable (the staticlib shims are embedded-only
    # and cannot run `cargo test`); see flux/keysource/Cargo.toml.
    "flux/keysource",
    # flux-side product shell (Carrier trait + the review→confirm→sign flow): the
    # sequence-and-presentation layer every carrier shares, so a new carrier writes
    # only its own I/O. Rust carriers link forms directly — no C-ABI hop.
    "flux/shell",
    # First no-hardware carrier (files + stdin/stdout): the shell's host TDD loop and
    # the chain-axis acceptance executor.
    "flux/desktop",
]
exclude = [
    "fuzz",
    "probes/noalloc",
    "vendor/monero-clsag",
    "vendor/curve25519-dalek",
    "vendor/cryptonight",
    "vendor/monero-bulletproofs",
    "vendor/rqrr",
    "vendor/g2p",
    "vendor/g2poly",
    "vendor/quircs",
]
resolver = "2"

[dependencies]
# no_std support + zeroize
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }
# heapless stack-allocated containers (v1.0 interface decision)
heapless = "0.7"

# ===== Phase 4 real-algorithm dependencies (v2 §2.3 algorithm decisions) =====
# sha2 / sha3 (hash function family)
sha2 = { version = "0.10", default-features = false }   # SHA-256 / SHA-512
tiny-keccak = { version = "2.0", features = ["keccak"] }  # Keccak-256 (**not** SHA3-256)

# encoding (base58 + bech32 both self-implemented, no crate — v2 §3.5 zero heap allocation)
# base58: self-implemented in src/encoding/base58.rs (core algorithm ~50 lines)
# bech32: self-implemented in src/encoding/bech32.rs (sipa reference algorithm + GEN constants)

# elliptic curves (BTC/ETH secp256k1 + XMR/general ed25519)
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "schnorr", "arithmetic"] }  # secp256k1; precomputed-tables off — the once_cell Lazy table takes 31KB RAM (SRAM overflow); signing ~2-4x slower is acceptable (measured on device at P6.2c)
# BIP-32 HD derivation (BTC + ETH + Cosmos)
# primeorder = internal Field/PrimeField traits of k256 0.14
primeorder = { version = "0.14", default-features = false, features = ["critical-section"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize"], optional = true }  # Ed25519 (XMR / SOL / Cardano); owned by `prim-ed25519`; std only on host (see the target config below)
monero-ed25519 = { version = "0.1", default-features = false, optional = true }  # Ed25519 + Pedersen commitment (XMR)
# "generator-cache" = shlosilo vendor patch (raw extended-coordinate serialize/reconstruct pair for the BP+ generator cache); see patches/curve25519-dalek-generator-cache.patch
curve25519-dalek = { version = "4", default-features = false, features = ["zeroize", "precomputed-tables", "rand_core", "generator-cache"], optional = true }  # Ed25519 foundation (curve25519-dalek 4 already serves as the SemVer abstraction layer); owned by `prim-ed25519`
monero-clsag = { version = "0.1", default-features = false, optional = true }  # CLSAG ring signature (XMR)
monero-bulletproofs = { path = "vendor/monero-bulletproofs", default-features = false, features = ["compile-time-generators"], optional = true }  # Bulletproofs+; vendor patch: generator loop decompresses to avoid vec![decompress();2048] blowing the stack
base58-monero = { version = "2", default-features = false, optional = true }  # XMR base58 (encoding class, audited; check feature omitted because encode_check has a bug and we hand-write it); owned by `prim-base58-monero`
# explicit so alloc-fallback can map the alloc re-export root (vendor-patched)
std-shims = { version = "0.1.5", default-features = false, optional = true }
monero-io = { version = "0.1.0", default-features = false, optional = true }
cuprate-cryptonight = { path = "vendor/cryptonight", default-features = false, optional = true }  # CryptoNight V0 (XMR txset chacha key derivation); vendored no_std version, see the comment in vendor/cryptonight/Cargo.toml
chacha20 = { version = "0.9", default-features = false, optional = true }  # ChaCha20 + ChaCha20Legacy (XMR txset decryption; keystone uses the same 0.9.1)
# §B.5 RNG injection finalized: entropy → HKDF-SHA256 → ChaCha20Rng (no homemade DRBG)
hkdf = { version = "0.12", default-features = false, optional = true }  # HKDF-SHA256 (RFC 5869) seed derivation
hmac = { version = "0.12", default-features = false }  # HMAC-SHA512 BIP-32 CKD (self-implemented at P2-04)
rand_chacha = { version = "0.3", default-features = false }  # ChaCha20Rng CSPRNG (same as the keystone monero app)
subtle = { version = "2", default-features = false }  # CtOption/ct_eq (XMR Schnorr verification + curve25519 scalar canonical checks)
bitcoin_hashes = { version = "0.14", default-features = false, package = "bitcoin_hashes" }  # RIPEMD-160 + SHA-256 (BTC P2WPKH witness program + hash160)
ripemd = { version = "0.1", default-features = false }  # RIPEMD-160
digest = { version = "0.10", default-features = false }  # Digest trait for k256 sign_digest_recoverable
rand_core = { version = "0.6", default-features = false }  # CLSAG signing RNG (XMR)
# BIP-32 HD derivation (BTC + ETH + Cosmos)

# PBKDF2 (BIP-39 seed derivation)
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }  # PBKDF2-HMAC-SHA512

# The build script hashes the build identity (BUILD_FINGERPRINT, chain axis batch 2 /
# L4). sha2 is already a runtime dependency of the core at the same version, so this is
# a HOST-SIDE edge only: it adds no crate to the product graph, changes no version, and
# leaves Cargo.lock untouched (the lock entry for the root package already lists
# sha2 0.10.9). No new dependency is introduced.
[build-dependencies]
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# QR pipeline host validation (pico2 camera path): encoder + decoder used
# together, feeding the decoder synthetic camera-like frames.
qrcodegen-no-heap = "1.8.1"
rqrr = { version = "0.11", default-features = false }
# property-based tests (Phase 3)
proptest = "1.4"
# P1-03 compile-fail: assert_not_impl_any! const assertion (zero-process equivalent of trybuild)
static_assertions = "1"
# XMR cross-validation imports curve25519-dalek directly for ECDH + cofactor reference computation (keystone oracle reproduction)
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize", "precomputed-tables", "rand_core"] }
# Pedersen commitment generators for Bulletproofs+ — DEV-ONLY (test oracles
# re-derive reference generators via its Vec API). Kept out of the runtime
# dependency set: the Vec API pins an allocator to the graph (Z6 probe).
# Chain axis (batch 3) measured this one: cargo refuses `optional = true` on a
# dev-dependency ("dev-dependencies are not allowed to be optional"), and moving
# it into `[dependencies]` to make it optional would pin an allocator to the
# product graph — the exact thing the Z6 probe exists to catch. It therefore
# stays a plain dev-dependency: it is XMR-only, but a dev-dependency cannot reach
# a product graph at all (`cargo tree -e normal,build` never lists it), so there
# is nothing to cut here. Its `dep`-free `alloc` feature reference below is
# harmless for the same reason.
monero-bulletproofs-generators = { version = "0.1", default-features = false }
# P1-06 oracle: official-format tx parser (monero-rs) to diagnose deviations in our wire serialization
monero = { version = "0.21" }
# Independent Keccak-256 implementation (different crate than the runtime's
# tiny-keccak wrapper): golden-pin cross-validation in tests/wallet_fp_golden.rs
# recomputes keccak256(spend_pub || view_pub) through this second path so a
# drift in `forms/encoding/keccak256` cannot go green against itself.
sha3 = "0.10"
# Test-face vendor alloc unification (the `--no-default-features` unit-test
# face): the alloc-fallback product feature forwards these vendor alloc faces
# (Clsag::verify, Bulletproof::verify, Vec: std_shims::Write), but a featureless
# test build drops them and the unit tests fail to compile. Re-declaring the
# same packages here as dev-deps enables the features for test/example builds
# ONLY (resolver v2 keeps dev-dep features out of product builds), so the Z6
# no-allocator graph probes and device faces are bit-identical. Same pattern as
# the curve25519-dalek dev-dep above.
monero-clsag = { version = "0.1", default-features = false, features = ["alloc-fallback"] }
monero-bulletproofs = { path = "vendor/monero-bulletproofs", default-features = false, features = ["compile-time-generators", "alloc-fallback"] }
std-shims = { version = "0.1.5", default-features = false, features = ["alloc"] }

[features]
# Device-side BP+ generator cache FFI bridge (C flash backend). Off = no-op stub symbol.
generator-cache-ffi = []
# Z5.2b: transitional generator no-storage fallback (vendor alloc-fallback).
# Host/tests default ON; device builds (Z6 no-allocator acceptance) build with
# --no-default-features (plus std as needed) and MUST provide table storage.
alloc-fallback = ["monero-bulletproofs?/alloc-fallback", "monero-clsag?/alloc-fallback", "curve25519-dalek?/alloc-fallback", "curve25519-dalek?/alloc", "cuprate-cryptonight?/alloc-fallback", "std-shims?/alloc", "monero-io?/alloc", "monero-bulletproofs-generators/alloc", "base58-monero?/alloc"]
# Device primitive perf-bench FFI (raw per-op costs; diagnostic only).
# The benchmark face measures the ed25519/Curve25519 primitives themselves, so it cannot
# exist without them: enabling the face enables its subject. Without this the module was
# compiled unconditionally and a `chain-btc`-only build failed with unresolvable imports -
# invisible for as long as every build happened to include `chain-xmr` (pool #100).
# The benchmark face measures the ed25519/Curve25519 primitives themselves, so it CANNOT exist
# without them - and it reaches `monero_bulletproofs`, whose vendored crate only compiles with the
# alloc/std-shims that `chain-xmr` brings (measured in S9 batch B; that is also why `prim-bulletproof`
# owns no dependency). So this face implies `chain-xmr` rather than pretending to be chain-neutral:
# before this, a `chain-btc`-only build failed with unresolvable imports, invisible as long as every
# build happened to include XMR (pool #100).
#
# Consequence, stated so it is not discovered the hard way: a genuinely BTC-only carrier must not
# enable the XMR diagnostic faces (`perf-bench-ffi`, `generator-cache-ffi`, `cn-timing-ffi`). If it
# does, forgebox's configure-time cross-check refuses the build and names the mismatch.
perf-bench-ffi = ["curve25519-dalek?/perf-bench", "prim-ed25519", "prim-bulletproof", "chain-xmr"]
# Measurement-only knob (chain axis batch 3, §9.5-2 / §9.4): k256's precomputed
# tables are OFF by default because the once_cell Lazy table costs ~31 KB of RAM
# (see the k256 dependency line). This feature exists so the cost can be MEASURED
# per carrier instead of guessed: it is deliberately NOT part of `default`, NOT in
# any `builds/*.toml`, and no code path requires it. Turning it on trades SRAM for
# signing speed; the numbers live in the design note's size account.
k256-precomp = ["k256/precomputed-tables"]
prove-timing-ffi = ["monero-bulletproofs?/prove-timing"]
cn-timing-ffi = ["prove-timing-ffi", "cuprate-cryptonight?/cn-timing"]
tx-phase-timing-ffi = ["prove-timing-ffi"]
# ===== chain axis (2026-09-19 design note §9.3-2 / §9.4) =====
# Additive-only (Cargo union semantics): any build that turns one on has it
# globally. NEVER make these mutually exclusive and never let one imply
# another. Each one gates `forms/chain/<name>` plus every dispatch site that
# would reach it; a disabled chain's request answers the PRE-EXISTING error
# kind `ChainKindUnsupported` (C-ABI -10 `UnsupportedChainKind`), no new code.
#
# Batch 1 added the switches; batch 2 the manifests; batch 3 (this one) makes
# the XMR-exclusive dependencies REAL optional deps carried by `chain-xmr`, so a
# chain-off build also cuts the graph. Two rules keep that true:
#   1. every dependency named here is XMR-EXCLUSIVE (`dep:` below). Shared
#      foundations stay unconditional on purpose — `curve25519-dalek` (XMR *and*
#      the Ed25519 Layer-A primitive), `ed25519-dalek` (the same Layer-A
#      consumer set: SOL/Cardano address stubs, slip10, eddsa/fcmp),
#      `base58-monero` (reached through the ungated export-protocol face) and
#      `rand_core` (the CSPRNG abstraction, in the graph through `rand_chacha`).
#      Gating one of those would gate a capability axis, not this one.
#   2. every feature that used to name one of them with a bare `crate/feat` now
#      uses a WEAK reference (`crate?/feat`). A strong reference re-activates
#      an optional dependency from a feature that has nothing to do with the
#      chain — `alloc-fallback` alone would drag the whole XMR stack back into a
#      BTC-only build and silently undo this batch.
# ===== primitive axis (chain-axis design §3, S9) =====
# One feature per capability that OWNS a dependency. `chain-*` above implies these (see their
# lists), and `build_declared.sh` exports SHLOSILO_PRIMS from `capabilities/<chain>.toml` so
# build.rs can compare the declaration against the features cargo actually resolved.
#
# Rule (measured in batch 3, kept here): a feature that names an optional dependency MUST use a
# weak reference (`dep?/feat`). A strong one re-activates the dependency from a feature that has
# nothing to do with the primitive — `alloc-fallback` alone would drag Ed25519 back into a
# secp256k1-only build and silently undo this axis.
# secp256k1 owns NO optional dependency on purpose: every wired chain (BTC and ETH) needs it, and
# the Layer-A module plus derivation/bip32 sit under both. A feature that gates nothing is still
# useful — it lets the declaration say what a build uses — but pretending it can be cut would be
# the kind of claim this axis exists to prevent.
prim-secp256k1 = []
# OWNS the two Ed25519 crates (S9 batch B). Turning this off drops `ed25519-dalek` and
# `curve25519-dalek` from the graph, which is the point of the axis; every consumer of
# `curve_primitive::ed25519` / `types::secret_scalar` is gated on this feature.
prim-ed25519 = ["dep:ed25519-dalek", "dep:curve25519-dalek"]
prim-scalar-reduce = ["prim-ed25519"]
# OWNS the audited XMR base58 crate. Debt D1: before this batch `base58-monero` reached a
# BTC-only build through the ungated export-protocol face; the gate now follows the
# exporters too (see business/export_readonly.rs).
prim-base58-monero = ["dep:base58-monero"]
# Semantic tiers: no dependency of their own, but the capability table names them, so a build
# that declares a chain without them would be a declaration the code cannot honour.
#
# `prim-clsag` / `prim-bulletproof` deliberately do NOT own `dep:monero-clsag` /
# `dep:monero-bulletproofs` even though they name those capabilities. Measured (S9 batch B):
# enabling either one WITHOUT `chain-xmr` fails to compile inside the vendored crate
# (`vendor/monero-clsag/src/lib.rs: use std_shims::vec::Vec` — `std-shims`/alloc come from
# the chain feature, not from a primitive). A feature that cannot be enabled is worse than a
# feature that owns nothing, so the vendor crates stay owned by `chain-xmr` below and the
# primitives stay semantic. They also imply `prim-ed25519`, which is the real graph edge.
prim-ecdsa = ["prim-secp256k1"]
prim-schnorr = ["prim-secp256k1"]
prim-bip32 = ["prim-secp256k1"]
prim-clsag = ["prim-ed25519"]
prim-bulletproof = ["prim-ed25519"]
prim-bech32 = []
prim-base58check = []
prim-psbt = ["prim-secp256k1"]
prim-crypto-psbt = ["prim-psbt"]

chain-btc = [
    "prim-secp256k1",
    "prim-ecdsa",
    "prim-schnorr",
    "prim-bip32",
    "prim-base58check",
    "prim-bech32",
    "prim-psbt",
    "prim-crypto-psbt",
]
chain-eth = [
    "prim-secp256k1",
    "prim-ecdsa",
    "prim-bip32",
]
chain-xmr = [
    "prim-ed25519",
    "prim-scalar-reduce",
    "prim-clsag",
    "prim-bulletproof",
    "prim-base58-monero",
    "dep:monero-clsag",
    "dep:monero-bulletproofs",
    "dep:monero-ed25519",
    "dep:monero-io",
    "dep:std-shims",
    "dep:cuprate-cryptonight",
    "dep:chacha20",
    "dep:hkdf",
]
default = ["std", "alloc-fallback", "chain-btc", "chain-eth", "chain-xmr"]
# std enabled (on by default, only for cargo test; Phase 5 real implementation switches to panic = "abort" without std)
std = ["rand_core/std", "ed25519-dalek?/std"]
# alloc enabled (ffi module uses Vec as a staging buffer for path elements)
# alloc = []  # heapless itself is no_std
# Device-side stage timing instrumentation (diagnostic only, never in production firmware)
device-timing = []
# S1 protocol profiles: the keystone dialect (WP1 I8 delete drill). NON-default
# on purpose: the default build is the "dialect off" variant (Cake only) and
# its green test face is the downstream zero-awareness proof; `--all-features`
# is the "on" variant (CI feature matrix = the C5 double build).
profile-keystone = []

# Chain axis (batch 1): examples that drive a specific chain layer are only built
# when that chain is compiled in. `required-features` is the cargo-native way to say
# "this target belongs to this switch" (an `#![cfg]` inside a bin would leave a
# main-less crate behind).
[[example]]
name = "p7_real_unsigned"
required-features = ["chain-xmr"]

[[example]]
name = "p7_real_sign"
required-features = ["chain-xmr"]

[[example]]
name = "dump_signed_psbt"
required-features = ["chain-btc"]

[[example]]
name = "review_eth_erc20"
required-features = ["chain-eth"]

[[example]]
name = "dump_sdk_artifacts"
required-features = ["chain-eth"]

[lib]
# The pure-function core is the `forms` tree; flux appearances consume it.
path = "forms/lib.rs"
# rlib only. The C-host staticlib is bundled by the flux/forgebox/staticlib
# shim package: a staticlib declared here would push a staticlib unit - and
# the runtime lang items it demands (global allocator + panic handler) - onto
# every build that compiles this crate, including Rust-native appearances
# (flux/pico2) that supply their own runtime.
crate-type = ["rlib"]

# host (Linux/macOS): critical-section via std, ed25519-dalek with std enabled
# S9 batch B: `ed25519-dalek` is optional now (owned by `prim-ed25519`). This target row
# stays `optional = true` too — a required row here re-activates the crate for every host
# build and would make the btc-only host face keep the graph the axis exists to cut. The
# `std` feature carries `ed25519-dalek?/std` instead (weak reference, so `std` alone does
# not pull the crate back).
[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { version = "1", features = ["std"] }
ed25519-dalek = { version = "2.1", optional = true }

# embedded (thumbv7em-none-eabihf etc.): critical-section RawRestoreState = u8,
# aligned with embassy-rp's critical-section-impl (flux/pico2) and with the
# forgebox staticlib bundle (flux/forgebox/staticlib), whose PRIMASK impl
# returns 0/1.
[target.'cfg(target_os = "none")'.dependencies]
critical-section = { version = "1", features = ["restore-state-u8"] }

[profile.release]
# 2026-09-03: XMR on-device 74.9s vs keystone seconds on the same board. sign_xmr calls CN twice
# cryptonight_hash_v0 (2MB scratchpad + 2^20 software AES rounds); -Os compiles the AES inner loop very slowly.
# keystone workspace has no [profile.release] → cargo defaults to opt-level=3. Size headroom is sufficient (bin ~0.56MB / 4.5MB cap).
opt-level = 3
lto = true
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
opt-level = "s"
debug = true
# Audit #15 P2-01: integration tests link the library as a dependency, which
# Cargo builds with the `dev` profile (only the test targets themselves use
# `profile.test`). Keep checks here too so underflow in library code is caught
# when running `cargo test`.
overflow-checks = true

[profile.test]
opt-level = "s"
debug = true
# Audit #15 P2-01: keep overflow checks on in tests so arithmetic underflow
# (e.g. a 1-based id of 0 decremented before its bounds check) is caught as a
# panic instead of silently wrapping to a large index. Release keeps the
# default (off) for speed; the guards themselves are unconditional.
overflow-checks = true
# Vendored curve25519-dalek 4.1.3 with a shlosilo patch: direct affine-field constructor
# used by the BP+ generator cache to skip 4096 sqrt-based decompressions at load time
# (14-17s -> ~0.2s on device). No crypto semantics touched; see vendor/curve25519-dalek/src/edwards.rs.
[patch.crates-io]
curve25519-dalek = { path = "vendor/curve25519-dalek" }
# QR decoding for the pico2 camera path: rqrr + its GF(2^p) helper are
# std-only upstream; vendored with a minimal no_std patch (no logic
# changes). Exit condition: drop both when upstream ships no_std (see
# patches/rqrr-g2p-no-std.patch).
rqrr = { path = "vendor/rqrr" }
g2p = { path = "vendor/g2p" }
g2poly = { path = "vendor/g2poly" }
# quircs (pure-Rust quirc port): the QR decoder that matches the reference
# implementation (KOSMO's sim_qr_reader uses quircs 0.10). Upstream is
# std-only; vendored with a mechanical no_std patch - see
# patches/quircs-no-std.patch. Exit condition: drop both when upstream
# ships no_std (watch github.com/dignifiedquire/quircs).
quircs = { path = "vendor/quircs" }
# monero-clsag (monero-oxide; kayabaNerve): CLSAG ring signature. Vendored
# for the Z5 clsag memory surgery (方案 A, 2026-09-24): zero-semantic-change
# de-alloc (ring capacity 16) + matching upstream PR track. Exit condition:
# upstream merges the equivalent change and releases >0.1.0 (see VENDOR.md).
monero-clsag = { path = "vendor/monero-clsag" }
# monero-oxide ed25519 / io / std-shims (kayabaNerve): vendored 2026-09-28 for
# the Z5/Z6 de-alloc surgery (Vec-typed APIs -> scratch/slice faces; alloc
# roots feature-gated). These trees were measured in-tree but never WIRED —
# both workspaces kept resolving the registry copies (Z6 graph probe caught
# it: registry monero-ed25519 pulls curve25519-dalek/alloc unconditionally).
# Exit condition: upstream merges the no-alloc API faces (see VENDOR.md).
monero-ed25519 = { path = "vendor/monero-ed25519" }
monero-io = { path = "vendor/monero-io" }
monero-bulletproofs-generators = { path = "vendor/monero-bulletproofs-generators" }
# base58-monero (monero-rs): vendored 2026-09-29 with a visibility-only patch
# (`encode_block` pub) so the XMR address encoder emits block-wise into caller
# buffers (Z6 zero-heap; the String `encode` pins an allocator). Algorithm
# untouched; exit condition: upstream exposes a no-alloc encode face.
base58-monero = { path = "vendor/base58-monero" }
std-shims = { path = "vendor/std-shims" }
