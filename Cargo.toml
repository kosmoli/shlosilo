[package]
name = "shlosilo"
version = "0.5.0"
edition = "2021"

# shlosilo-poc4: Phase 2.0 + Phase 4 real algorithms (encoding + crypto primitives) — native target
#
# Phase 4 v2: self-implemented base58 + bech32 (v2 §3.5 zero-heap-allocation principle)
#
# Scope:
#   - five-layer directory structure (types / derivation / entropy / business)
#   - error code system (error.rs)
#   - Network enum + ChainKind enum
#   - Mnemonic struct + WordCount enum
#   - DerivationPath struct
#   - 4 business function signatures (unimplemented!() stubs)
#
# Out of scope (deferred to Phase 2.1 / 2.2 / 2.3 in later sessions):
#   - Layer A/B/C/D/E five stub module layers (crypto / signature / address / ur codec)
#   - sr25519 / cosmos / polkadot new files (only real implementation at Phase 8+)
#   - L2a / L2b / L3 imperative shell
#   - real algorithms (Phase 4)
#
# Difference from shlosilo-poc3: poc3 is a thumbv7em-none-eabihf embedded target + staticlib,
# poc4 is a native target + rlib, dedicated to cargo check for Phase 2.0 compile verification.

[workspace]
# Monorepo: the root crate is the `forms` core; flux appearances live under
# flux/. pico2 is a Rust-native appearance (it owns its runtime + embassy);
# forgebox's CMake/build.sh flow consumes the staticlib bundled by its
# staticlib/ shim package.
# vendor/* and fuzz/ stay standalone: vendor is third-party patched code (kept
# out of workspace lint gates, as before the workspace existed); fuzz is a
# cargo-fuzz crate with its own lockfile.
members = ["flux/pico2", "flux/forgebox/staticlib", "flux/host-sim/staticlib"]
exclude = [
    "fuzz",
    "probes/noalloc",
    "vendor/monero-clsag",
    "vendor/curve25519-dalek",
    "vendor/cryptonight",
    "vendor/monero-bulletproofs",
    "vendor/rqrr",
    "vendor/g2p",
    "vendor/g2poly",
    "vendor/quircs",
]
resolver = "2"

[dependencies]
# no_std support + zeroize
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }
# heapless stack-allocated containers (v1.0 interface decision)
heapless = "0.7"

# ===== Phase 4 real-algorithm dependencies (v2 §2.3 algorithm decisions) =====
# sha2 / sha3 (hash function family)
sha2 = { version = "0.10", default-features = false }   # SHA-256 / SHA-512
tiny-keccak = { version = "2.0", features = ["keccak"] }  # Keccak-256 (**not** SHA3-256)

# encoding (base58 + bech32 both self-implemented, no crate — v2 §3.5 zero heap allocation)
# base58: self-implemented in src/encoding/base58.rs (core algorithm ~50 lines)
# bech32: self-implemented in src/encoding/bech32.rs (sipa reference algorithm + GEN constants)

# elliptic curves (BTC/ETH secp256k1 + XMR/general ed25519)
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "schnorr", "arithmetic"] }  # secp256k1; precomputed-tables off — the once_cell Lazy table takes 31KB RAM (SRAM overflow); signing ~2-4x slower is acceptable (measured on device at P6.2c)
# BIP-32 HD derivation (BTC + ETH + Cosmos)
# primeorder = internal Field/PrimeField traits of k256 0.14
primeorder = { version = "0.14", default-features = false, features = ["critical-section"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize"] }  # Ed25519 (XMR / SOL / Cardano); std only on host (see the target config below)
monero-ed25519 = { version = "0.1", default-features = false }  # Ed25519 + Pedersen commitment (XMR)
# "generator-cache" = shlosilo vendor patch (raw extended-coordinate serialize/reconstruct pair for the BP+ generator cache); see patches/curve25519-dalek-generator-cache.patch
curve25519-dalek = { version = "4", default-features = false, features = ["zeroize", "precomputed-tables", "rand_core", "generator-cache"] }  # Ed25519 foundation (curve25519-dalek 4 already serves as the SemVer abstraction layer)
monero-clsag = { version = "0.1", default-features = false }  # CLSAG ring signature (XMR)
monero-bulletproofs = { path = "vendor/monero-bulletproofs", default-features = false, features = ["compile-time-generators"] }  # Bulletproofs+; vendor patch: generator loop decompresses to avoid vec![decompress();2048] blowing the stack
monero-bulletproofs-generators = { version = "0.1", default-features = false }  # Pedersen commitment generators for Bulletproofs+

base58-monero = { version = "2", default-features = false }  # XMR base58 (encoding class, audited; check feature omitted because encode_check has a bug and we hand-write it)
cuprate-cryptonight = { path = "vendor/cryptonight", default-features = false }  # CryptoNight V0 (XMR txset chacha key derivation); vendored no_std version, see the comment in vendor/cryptonight/Cargo.toml
chacha20 = { version = "0.9", default-features = false }  # ChaCha20 + ChaCha20Legacy (XMR txset decryption; keystone uses the same 0.9.1)
# §B.5 RNG injection finalized: entropy → HKDF-SHA256 → ChaCha20Rng (no homemade DRBG)
hkdf = { version = "0.12", default-features = false }  # HKDF-SHA256 (RFC 5869) seed derivation
hmac = { version = "0.12", default-features = false }  # HMAC-SHA512 BIP-32 CKD (self-implemented at P2-04)
rand_chacha = { version = "0.3", default-features = false }  # ChaCha20Rng CSPRNG (same as the keystone monero app)
subtle = { version = "2", default-features = false }  # CtOption/ct_eq (XMR Schnorr verification + curve25519 scalar canonical checks)
bitcoin_hashes = { version = "0.14", default-features = false, package = "bitcoin_hashes" }  # RIPEMD-160 + SHA-256 (BTC P2WPKH witness program + hash160)
ripemd = { version = "0.1", default-features = false }  # RIPEMD-160
digest = { version = "0.10", default-features = false }  # Digest trait for k256 sign_digest_recoverable
rand_core = { version = "0.6", default-features = false }  # CLSAG signing RNG (XMR)
# BIP-32 HD derivation (BTC + ETH + Cosmos)

# PBKDF2 (BIP-39 seed derivation)
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }  # PBKDF2-HMAC-SHA512

[dev-dependencies]
# QR pipeline host validation (pico2 camera path): encoder + decoder used
# together, feeding the decoder synthetic camera-like frames.
qrcodegen-no-heap = "1.8.1"
rqrr = { version = "0.11", default-features = false }
# property-based tests (Phase 3)
proptest = "1.4"
# P1-03 compile-fail: assert_not_impl_any! const assertion (zero-process equivalent of trybuild)
static_assertions = "1"
# XMR cross-validation imports curve25519-dalek directly for ECDH + cofactor reference computation (keystone oracle reproduction)
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize", "precomputed-tables", "rand_core"] }
# P1-06 oracle: official-format tx parser (monero-rs) to diagnose deviations in our wire serialization
monero = { version = "0.21" }

[features]
# Device-side BP+ generator cache FFI bridge (C flash backend). Off = no-op stub symbol.
generator-cache-ffi = []
# Z5.2b: transitional generator no-storage fallback (vendor alloc-fallback).
# Host/tests default ON; device builds (Z6 no-allocator acceptance) build with
# --no-default-features (plus std as needed) and MUST provide table storage.
alloc-fallback = ["monero-bulletproofs/alloc-fallback", "monero-clsag/alloc-fallback", "curve25519-dalek/alloc-fallback", "curve25519-dalek/alloc", "cuprate-cryptonight/alloc-fallback"]
# Device primitive perf-bench FFI (raw per-op costs; diagnostic only).
perf-bench-ffi = ["curve25519-dalek/perf-bench"]
prove-timing-ffi = ["monero-bulletproofs/prove-timing"]
cn-timing-ffi = ["prove-timing-ffi", "cuprate-cryptonight/cn-timing"]
tx-phase-timing-ffi = ["prove-timing-ffi"]
default = ["std", "alloc-fallback"]
# std enabled (on by default, only for cargo test; Phase 5 real implementation switches to panic = "abort" without std)
std = ["rand_core/std"]
# alloc enabled (ffi module uses Vec as a staging buffer for path elements)
# alloc = []  # heapless itself is no_std
# Device-side stage timing instrumentation (diagnostic only, never in production firmware)
device-timing = []

[lib]
# The pure-function core is the `forms` tree; flux appearances consume it.
path = "forms/lib.rs"
# rlib only. The C-host staticlib is bundled by the flux/forgebox/staticlib
# shim package: a staticlib declared here would push a staticlib unit - and
# the runtime lang items it demands (global allocator + panic handler) - onto
# every build that compiles this crate, including Rust-native appearances
# (flux/pico2) that supply their own runtime.
crate-type = ["rlib"]

# host (Linux/macOS): critical-section via std, ed25519-dalek with std enabled
[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { version = "1", features = ["std"] }
ed25519-dalek = { version = "2.1", features = ["std"] }

# embedded (thumbv7em-none-eabihf etc.): critical-section RawRestoreState = u8,
# aligned with embassy-rp's critical-section-impl (flux/pico2) and with the
# forgebox staticlib bundle (flux/forgebox/staticlib), whose PRIMASK impl
# returns 0/1.
[target.'cfg(target_os = "none")'.dependencies]
critical-section = { version = "1", features = ["restore-state-u8"] }

[profile.release]
# 2026-09-03: XMR on-device 74.9s vs keystone seconds on the same board. sign_xmr calls CN twice
# cryptonight_hash_v0 (2MB scratchpad + 2^20 software AES rounds); -Os compiles the AES inner loop very slowly.
# keystone workspace has no [profile.release] → cargo defaults to opt-level=3. Size headroom is sufficient (bin ~0.56MB / 4.5MB cap).
opt-level = 3
lto = true
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
opt-level = "s"
debug = true
# Audit #15 P2-01: integration tests link the library as a dependency, which
# Cargo builds with the `dev` profile (only the test targets themselves use
# `profile.test`). Keep checks here too so underflow in library code is caught
# when running `cargo test`.
overflow-checks = true

[profile.test]
opt-level = "s"
debug = true
# Audit #15 P2-01: keep overflow checks on in tests so arithmetic underflow
# (e.g. a 1-based id of 0 decremented before its bounds check) is caught as a
# panic instead of silently wrapping to a large index. Release keeps the
# default (off) for speed; the guards themselves are unconditional.
overflow-checks = true
# Vendored curve25519-dalek 4.1.3 with a shlosilo patch: direct affine-field constructor
# used by the BP+ generator cache to skip 4096 sqrt-based decompressions at load time
# (14-17s -> ~0.2s on device). No crypto semantics touched; see vendor/curve25519-dalek/src/edwards.rs.
[patch.crates-io]
curve25519-dalek = { path = "vendor/curve25519-dalek" }
# QR decoding for the pico2 camera path: rqrr + its GF(2^p) helper are
# std-only upstream; vendored with a minimal no_std patch (no logic
# changes). Exit condition: drop both when upstream ships no_std (see
# patches/rqrr-g2p-no-std.patch).
rqrr = { path = "vendor/rqrr" }
g2p = { path = "vendor/g2p" }
g2poly = { path = "vendor/g2poly" }
# quircs (pure-Rust quirc port): the QR decoder that matches the reference
# implementation (KOSMO's sim_qr_reader uses quircs 0.10). Upstream is
# std-only; vendored with a mechanical no_std patch - see
# patches/quircs-no-std.patch. Exit condition: drop both when upstream
# ships no_std (watch github.com/dignifiedquire/quircs).
quircs = { path = "vendor/quircs" }
# monero-clsag (monero-oxide; kayabaNerve): CLSAG ring signature. Vendored
# for the Z5 clsag memory surgery (方案 A, 2026-09-24): zero-semantic-change
# de-alloc (ring capacity 16) + matching upstream PR track. Exit condition:
# upstream merges the equivalent change and releases >0.1.0 (see VENDOR.md).
monero-clsag = { path = "vendor/monero-clsag" }
