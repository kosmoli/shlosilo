[package]
name = "shlosilo-flux-desktop"
version = "0.5.0"
edition = "2021"
publish = false

# Desktop test carrier: the shell's second implementation and the first one that needs
# no hardware (design 2026-11-26 §5).
#
# What it is for: the host TDD loop for the shell (a real UR round trip with no board),
# the executor for the chain-axis matrix, and the future golden source for UI captures.
# What it is NOT: an operator build. No camera, no panel, no touch — files in, terminal
# text out (design §5 "零显示零相机零触摸" is about the acceptance instrument, and this
# is it).
#
# Dependency note: forms is a direct path dependency (no C-ABI hop), and the shell is a
# path dependency inside flux. No new third-party crates: argument parsing, terminal I/O
# and the UR text in/out are all std plus forms' own codecs.

[[bin]]
name = "shlosilo-flux-desktop"
path = "src/main.rs"

[dependencies]
shlosilo = { path = "../.." }
shlosilo-flux-shell = { path = "../shell" }
