[package]
name = "shlosilo-pico2"
version = "0.1.0"
edition = "2024"

[dependencies]
# forms core (workspace root crate). Rust-native appearance: the core is a
# plain rlib here - pico2 owns its runtime (embedded-alloc + fault.rs;
# critical-section from embassy-rp), so no C-host hooks are involved.
# alloc-fallback: the USB console host keeps its Vec-based debug/UR session
# shells (this firmware links an allocator; the Z6 zero-heap artifact is the
# separate noalloc probe). Production sign paths use the _into forms either way.
shlosilo = { path = "../..", default-features = false, features = ["alloc-fallback"] }

# RP2350 async stack
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl", "defmt", "unstable-pac"] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"
cortex-m-rt = "0.7"
cortex-m = "0.7"

# USB device stack: CDC-ACM serial so the board is reachable from a host
# (boot logs without a debug probe; the data channel for the signing flow).
embassy-usb = "0.6"
embassy-usb-logger = "0.6"
log = "0.4"

# Optional direct dependency for the `codegen-compact` experiment: lets
# this host enable an out-of-line codegen feature on the patched dalek
# (see the bp5 attribution). Inactive unless the feature is on.
curve25519-dalek = { version = "4", default-features = false, optional = true }

# QR encoder for the UI (Nayuki's library, no-heap fork, MIT, no_std).
qrcodegen-no-heap = "1.8.1"

# QR decoder for the camera path (rqrr, MIT/ISC). Upstream is std-only;
# the workspace [patch.crates-io] redirects it (plus g2p/g2poly) to the
# vendored no_std build - see patches/rqrr-g2p-no-std.patch.
rqrr = { version = "0.11", default-features = false }

# PIO assembly (pio-rs): the camera capture program is written with its
# `pio_asm!` macro. embassy-rp depends on the same crate.
pio = "0.3"

# QR decoding, quirc port (pure Rust) - the decoder the reference
# implementation (KOSMO's sim_qr_reader) uses. Takes the grayscale plane
# directly and does its own thresholding: measurably more robust on real
# camera frames than rqrr. Upstream is std-only; the workspace
# [patch.crates-io] redirects it to the vendored no_std build.
quircs = "0.10"

# runtime glue
embedded-alloc = "0.7"
# panic-probe removed: fault.rs owns the panic + hard-fault handlers so
# crashes survive a reset and are reported over the console instead of
# halting silently (no debug probe on this bench).
defmt = "1"
defmt-rtt = "1"
static_cell = "2"

[features]
# Bench-only console surface (audit #17 P1-01). Enables the commands that
# inject entropy or load test key material, and the TRNG diagnostics:
# `xmrseed` (fixed XMR entropy, for byte-exact host A/B), `entropy`
# (test-vector mnemonic) and `trng`/`trngdump`/`trngrst`/`trngprobe`/
# `trngemb`. Production builds (`make pico2` / `make pico2-uf2`) do not
# compile any of it - the fixed-entropy path must not exist in production
# images. Bench build: `make pico2-bench-uf2`. See src/console.rs.
bench = []

# XMR signing phase-timing probes (diagnostic; perf work). Enables the
# shlosilo timing hooks (L1 tx-phases / vendored BP+ prove / CryptoNight)
# and registers this host's embassy-time millisecond clock with all three.
# Diagnostic builds only - never part of production images. Combine with
# `bench` for the perf-experiment firmware: `make pico2-perf-uf2`.
perf-timing = [
    "shlosilo/tx-phase-timing-ffi",
    "shlosilo/cn-timing-ffi",
]

# Dalek device-primitive benchmarks (fmul / CT select / madd / chunked CT
# Straus / vartime 2-term fold) exposed on the console as `perfbench`.
# Diagnostic only; part of the perf-experiment firmware.
perf-bench = ["shlosilo/perf-bench-ffi"]

# bp5 wrapper-tax experiment: force the dalek CT-Straus core out-of-line
# for this host. Feature sets are per-build; forgebox builds never
# activate it (verify via the forgebox .a size when promoting).
codegen-compact = ["dep:curve25519-dalek", "curve25519-dalek/straus-compact-codegen"]
