[package]
name = "shlosilo-pico2"
version = "0.1.0"
edition = "2024"

[dependencies]
# forms core (workspace root crate). Rust-native appearance: the core is a
# plain rlib here - pico2 owns its runtime (embedded-alloc + fault.rs;
# critical-section from embassy-rp), so no C-host hooks are involved.
shlosilo = { path = "../..", default-features = false }

# RP2350 async stack
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl", "defmt", "unstable-pac"] }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"
cortex-m-rt = "0.7"
cortex-m = "0.7"

# USB device stack: CDC-ACM serial so the board is reachable from a host
# (boot logs without a debug probe; the data channel for the signing flow).
embassy-usb = "0.6"
embassy-usb-logger = "0.6"
log = "0.4"

# runtime glue
embedded-alloc = "0.7"
# panic-probe removed: fault.rs owns the panic + hard-fault handlers so
# crashes survive a reset and are reported over the console instead of
# halting silently (no debug probe on this bench).
defmt = "1"
defmt-rtt = "1"
static_cell = "2"

[features]
# Bench-only console surface (audit #17 P1-01). Enables the commands that
# inject entropy or load test key material, and the TRNG diagnostics:
# `xmrseed` (fixed XMR entropy, for byte-exact host A/B), `entropy`
# (test-vector mnemonic) and `trng`/`trngdump`/`trngrst`/`trngprobe`/
# `trngemb`. Production builds (`make pico2` / `make pico2-uf2`) do not
# compile any of it - the fixed-entropy path must not exist in production
# images. Bench build: `make pico2-bench-uf2`. See src/console.rs.
bench = []

# XMR signing phase-timing probes (diagnostic; perf work). Enables the
# shlosilo timing hooks (L1 tx-phases / vendored BP+ prove / CryptoNight)
# and registers this host's embassy-time millisecond clock with all three.
# Diagnostic builds only - never part of production images. Combine with
# `bench` for the perf-experiment firmware: `make pico2-perf-uf2`.
perf-timing = [
    "shlosilo/tx-phase-timing-ffi",
    "shlosilo/cn-timing-ffi",
]
