[package]
name = "shlosilo-forgebox"
version = "0.5.0"
edition = "2021"
publish = false

# The C-host staticlib bundle for the forgebox appearance. The core crate
# (workspace root) is rlib-only: a staticlib declared there would push a
# staticlib unit - and the runtime lang items it demands - onto every consumer
# of the crate, including Rust-native appearances (flux/pico2). This package
# is the only place where the staticlib is requested; the C-host runtime hooks
# (global allocator, panic handler, critical-section impl) live in its lib.rs.
#
# Embedded-only: build with an explicit embedded target (e.g.
# cargo build -p shlosilo-forgebox --target thumbv7em-none-eabihf, or via
# flux/forgebox/build.sh). A hosted-target build is rejected up front by
# build.rs with a clear error (audit #16 P2-01): the PRIMASK critical-section
# impl below requires `restore-state-u8`, which collides with the
# `critical-section/std` feature the core enables on host targets.
[lib]
name = "shlosilo"
crate-type = ["staticlib"]

# Key-supply module switch (design 密钥供给 §11, C-side half). Same name as the keysource
# crate's feature on purpose: this package is the carrier's build entry, so a carrier with a
# secure element says so once here and the C build says the same thing with the SAME word
# (`SHLOSILO_WITH_SE` in build.sh -> `--no-default-features` + the CMake option).
#
# It has to be this package's own feature, not just the dependency's: the keep-table entries
# for the SE FFI face are `#[cfg(feature = "se")]` in this crate's source, so a feature that
# does not exist here would leave them permanently compiled out - the table would not follow
# the module.
[features]
default = ["se"]
se = ["shlosilo-flux-keysource/se"]

[dependencies]
# Flux-side key acquisition face (Task 4): KeySource trait + QrKeySource thin
# shell. Rust-only so far (no C glue yet) — it rides the firmware graph so the
# thumbv7em build (CI + build.sh) compiles the face; the scan-flow glue lands
# with the caller.
# The Keystone 3 Pro board carries ATECC608B + DS28S60, so this carrier turns `se` on by
# default (above). A carrier without a secure element drops it with --no-default-features.
shlosilo-flux-keysource = { path = "../../keysource" }
# The diagnostic FFI features compiled into the .a for the C host.
shlosilo = { path = "../../..", default-features = false, features = [
    # Chain axis (batch 1): the C host drives every chain through the same ABI, so the
    # staticlib names all three. A carrier-specific subset is a build.sh decision later.
    "chain-btc",
    "chain-eth",
    "chain-xmr",
    "generator-cache-ffi",
    "cn-timing-ffi",
    "tx-phase-timing-ffi",
    "device-timing",
    "perf-bench-ffi",
    # WP4 (2026-11-02): the Keyed wire view (keystone-ecosystem shape).
    # REQUIRED for shlosilo_sign_session_view_ffi wire_view=1 to materialize;
    # without it the Keystone arm is cfg'd out (FeatureNotImplemented).
    "profile-keystone",
] }

# RawRestoreState for the PRIMASK-based impl in lib.rs (restore-state-u8,
# aligned with embassy-rp; the core's embedded target dep sets the same).
critical-section = { version = "1", features = ["restore-state-u8"] }
