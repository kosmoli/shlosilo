# The capability vocabulary — one entry per primitive a chain MAY declare.
#
# Three concepts, three homes (they must stay orthogonal):
#   * `capabilities/<chain>.toml` — what this chain IS (product semantics, sole declaration).
#   * `cargo` `chain-*` / `prim-*` — the MECHANISM (additive features; `chain-*` implies `prim-*`).
#   * `limits/<profile>.toml`     — resource ceilings only (never a chain set).
#
# `sources` names the module that implements the primitive TODAY. The names on the left are the
# target vocabulary from the chain-axis design; where the source has not been split yet (the
# address layer is re-cut in C2), the note says so and C2 updates this table. A capability whose
# `sources` are empty would make the scanner blind rather than green, so that is a hard error.
#
# scope decides who may declare it:
#   chain    — belongs to a chain; that chain declares it, and declaring it means "the product
#              path really uses this", not "the library contains it".
#   shared   — product-wide machinery (export/derivation plumbing). No chain owns it; it may be
#              referenced anywhere and must NOT appear in a chain declaration.
#   library  — implemented for a chain this product does not sign for yet. Referencing it is
#              allowed (and reported); declaring it in a chain file is a hard error.

schema_version = 1

[curves]
secp256k1     = { sources = ["curve_primitive::secp256k1"], feature = "prim-secp256k1" }
ed25519       = { sources = ["curve_primitive::ed25519"], feature = "prim-ed25519" }
scalar_reduce = { sources = ["curve_primitive::scalar_reduce"], note = "shared scalar reduction; consumed by ed25519 ops and the Monero derivation path", feature = "prim-scalar-reduce" }
p256          = { sources = ["curve_primitive::p256"], scope = "library" }
rsa           = { sources = ["curve_primitive::rsa"], scope = "library", note = "only reachable from the Arweave account/address surfaces" }

[signatures]
ecdsa           = { sources = ["signature::ecdsa_secp256k1"], feature = "prim-ecdsa" }
schnorr_bip340  = { sources = ["signature::schnorr_secp256k1"], feature = "prim-schnorr" }
clsag           = { sources = ["signature::clsag_ed25519"], crates = ["monero-clsag"], note = "XMR's CLSAG path runs on the monero-clsag crate from chain/xmr/clsag.rs; the forms wrapper has no production caller today", feature = "prim-clsag" }
eddsa           = { sources = ["signature::eddsa_ed25519"], scope = "library", note = "no production caller: no EdDSA-account chain is wired" }
fcmp            = { sources = ["signature::fcmp_ed25519"], scope = "library", note = "not wired into the XMR signing flow" }
rsa_pss         = { sources = ["signature::rsa_pss"], scope = "library" }

[proofs]
bulletproof_plus = { crates = ["monero-bulletproofs"], note = "consumed through the vendored crate inside chain/xmr/rct_sig.rs; there is no forms/ module of its own", feature = "prim-bulletproof" }

[derivations]
bip32                = { sources = ["derivation::bip32_secp256k1"], feature = "prim-bip32" }
monero_reduce_scalar = { sources = ["derivation::monero_reduce_scalar"], note = "the derivation XMR actually uses (business/export_format.rs::monero_material)", feature = "prim-scalar-reduce" }
path                 = { sources = ["derivation::path"], scope = "shared", note = "path arithmetic, not a scheme" }
bip32_multisig       = { sources = ["derivation::bip32_secp256k1_multisig"], scope = "library", note = "re-exported only" }
slip10_ed25519       = { sources = ["derivation::slip10_ed25519"], scope = "library", note = "no production caller" }
icarus_ed25519       = { sources = ["derivation::icarus_ed25519"], scope = "library", note = "no production caller" }

[address_encodings]
# Measured 2026-11-27 (S8): the encoders were ALREADY shared — they live in `forms/encoding/`, and
# the chain files build a payload and call them (btc_script::render does exactly the
# payload → encoder split this design asks for). What was wrong was this table: it pointed at
# `address::*` chain modules, several of which are stubs. Point each name at the code that
# actually implements it.
#
# The variant split (plain vs check base58, bech32 vs bech32m, hex vs EIP-55) is NOT expressed as
# separate entries yet: this scanner matches module paths, so two entries sharing one module would
# both light up on every reference and force chains to over-declare. The split lands with the
# function-level matcher (follow-up), and the notes below record which API call is which variant.
base58check   = { sources = ["encoding::base58"], note = "base58::encode_check_into (double-SHA256). The payload — version byte + HASH160 / script hash / account id — is chain assembly; the same module also carries plain base58::encode_into, which no wired chain uses today", feature = "prim-base58check" }
bech32        = { sources = ["encoding::bech32"], note = "bech32::encode (BIP-173) and bech32::encode_m (BIP-350, segwit v1..v16). The witness-program rules (v0 20/32 B, v1 taproot) stay in chain assembly", feature = "prim-bech32" }
eip55_hex     = { sources = ["address::eth"], note = "address::eth::encode_bytes: hex rendering WITH the EIP-55 case checksum — still in the chain file, extraction is cosmetic and deferred" }
base58_monero = { crates = ["base58-monero"], note = "block-wise encoding through the vendored audited crate, called from address::xmr (zero-heap wrapper over base58_monero::base58::encode_block)", feature = "prim-base58-monero" }
base64        = { sources = ["encoding::base64"], scope = "shared", note = "base64::encode_std / encode_url_safe. Transport/display machinery (BIP-137 message signatures render as base64 text), not a chain capability — the encoder also carries the url-safe variant Arweave would use" }
cbor_payload  = { sources = ["encoding::cbor"], scope = "shared", note = "the payload container inside UR messages and the keystone account shapes: product machinery, no chain owns it" }

[containers]
psbt        = { sources = ["chain::btc::psbt"], feature = "prim-psbt" }
rlp         = { sources = ["chain::eth::rlp", "chain::eth::from_rlp"] }
eip712      = { sources = ["chain::eth::eip712", "chain::eth::eip712_pool"], note = "typed-data pool + parser" }
monero_wire = { sources = ["chain::xmr::transaction", "chain::xmr::unsigned_txset", "chain::xmr::signed_txset"] }

[ur_codecs]
crypto_psbt         = { sources = ["ur::codec::crypto_psbt"], note = "the ur:crypto-psbt codec; the container it carries is [containers].psbt", feature = "prim-crypto-psbt" }
eth_sign_request    = { sources = ["ur::codec::eth_sign_request"] }
eth_signature       = { sources = ["ur::codec::eth_signature"] }
json_monero_viewkey = { sources = ["ur::codec::json_monero_viewkey"] }
crypto_hdkey        = { sources = ["ur::codec::crypto_hd_key"], scope = "shared", note = "export face, serves every chain" }
crypto_account      = { sources = ["ur::codec::crypto_account"], scope = "shared" }
account_text        = { sources = ["ur::codec::account_text"], scope = "shared" }
bytes               = { sources = ["ur::codec::bytes"], scope = "shared" }
zcash_accounts           = { sources = ["ur::codec::zcash_accounts"], scope = "library" }
arweave_crypto_account   = { sources = ["ur::codec::arweave_crypto_account"], scope = "library" }
