# Frozen debt: capabilities compiled into a combination although no chain in that combination
# declares them. This list exists so the closure check can be strict from C3 without pretending
# today's tree is already clean.
#
# Rules (enforced by scripts/check_capabilities.py):
#   * an entry must name a real path that causes the excess (`via`);
#   * an entry may NOT name a capability declared by any chain inside its own `combination` —
#     declaring it to silence the gate is the move this separation exists to prevent;
#   * the list may only shrink: a stale entry (the excess is gone) is an error;
#   * when `clear_in` is reached, the entry AND this mechanism are deleted (an empty allow-list
#     still invites new entries).
#
# These two are inert until C3: primitives are not cargo features yet, so no closure is computed
# today. They are ledger entries, not exemptions.
schema_version = 1

[[debt]]
id = "D1"
combination = "btc"
capability = "base58_monero"
via = "forms/business/export_readonly.rs"
clear_in = "C3"
note = "the export-protocol face answers JsonMoneroViewkey without a chain gate, so a btc-only build still links address/xmr + base58-monero"

[[debt]]
id = "D2"
combination = "btc"
capability = "ed25519"
via = "forms/types/key_session.rs"
clear_in = "C3"
note = "key_session derives both secp256k1 and ed25519 regardless of the chain set; trimming it is a capability-axis decision"
