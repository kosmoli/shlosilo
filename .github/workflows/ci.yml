name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # Audit #15 P1-01/P1-02: the previous gate only built the default feature
      # set, so the diagnostic-feature code paths (and their clippy lints) were
      # never compiled. `--all-features` closes that hole.
      - name: Clippy (all targets, warnings denied)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Tests (all features)
        run: cargo test --all-targets --all-features
      # Audit #15 P1-02: each diagnostic feature must build on its own (host).
      # Note: a host build with --no-default-features is not a supported
      # configuration (the no_std library's panic_handler collides with the
      # host's std); the stub build is exercised on the thumb target below,
      # which is where the C host actually links it.
      - name: Feature matrix (host)
        run: |
          for f in device-timing generator-cache-ffi perf-bench-ffi prove-timing-ffi cn-timing-ffi tx-phase-timing-ffi; do
            echo "::group::--features $f"
            cargo check --features "$f"
            echo "::endgroup::"
          done
      - name: Embedded checks (thumbv7em)
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo check --lib --no-default-features --target thumbv7em-none-eabihf
          cargo check --lib --no-default-features --target thumbv7em-none-eabihf \
            --features device-timing,generator-cache-ffi,prove-timing-ffi,cn-timing-ffi,tx-phase-timing-ffi,perf-bench-ffi
      - name: Vendor crate tests (timing hooks)
        run: cd vendor/cryptonight && cargo test --features cn-timing --lib

  fuzz-smoke:
    name: Fuzz smoke (4 targets x 30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # fuzz_run.sh 内部固定 nightly-2026-05-22(RUSTUP_TOOLCHAIN 覆盖),
      # rustup 会按需自动安装该工具链
      - name: Run smoke
        run: bash scripts/fuzz_run.sh 30

  appearances:
    name: Appearances (clean-checkout shims + hosts + gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Audit #16 P1-01: workspace default-members is the root package only,
      # so the two embedded shims and pico2 were outside every CI gate (the
      # `test` job above builds default members with no --target). This job
      # compiles each appearance from a clean checkout and runs the C-host
      # gates (keep table, header sync) outside the full forgebox build.
      # Audit #16 P2-01: shim checks pin explicit embedded targets; a hosted
      # build of the forgebox shim is rejected by its build.rs with a clear
      # error instead of a cryptic critical-section feature collision.
      # Audit #16 P2-02: this job *is* the clean-checkout rebuild - ignored
      # build products from a developer tree can never reach it.
      - name: C-ABI keep table gate
        run: python3 scripts/gen_ffi_keep.py --check
      - name: C header sync gate (pinned cbindgen)
        run: |
          cargo install cbindgen --version 0.27.0 --locked
          bash scripts/check_header.sh
      - name: forgebox staticlib (embedded, thumbv7em)
        run: cargo check -p shlosilo-forgebox --release --target thumbv7em-none-eabihf
      - name: host-sim (POSIX) staticlib + keep gate + link + run
        run: |
          make host-sim
          ./flux/host-sim/sim_l3 | tee /tmp/sim_l3.log
          grep -q "signed tx (111 bytes)" /tmp/sim_l3.log
          grep -q "=== all steps completed ===" /tmp/sim_l3.log
      - name: pico2 image + UF2 pack (thumbv8m)
        run: |
          # elf2uf2-rs pulls in libudev-sys for USB autodetect; the runner
          # image does not ship the dev package (local dev machines have it).
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev
          cargo install elf2uf2-rs --version 2.2.0 --locked
          make pico2-uf2
          ls -la target/thumbv8m.main-none-eabihf/release/shlosilo-pico2.uf2
