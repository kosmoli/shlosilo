name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # Audit #15 P1-01/P1-02: the previous gate only built the default feature
      # set, so the diagnostic-feature code paths (and their clippy lints) were
      # never compiled. `--all-features` closes that hole.
      - name: Clippy (all targets, warnings denied)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Fixture tracking gate (2026-10-20): tests/fixtures/tx2_cake_real_unsigned.bin
      # was referenced by include_bytes! but silently swallowed by the repo-wide
      # `*.bin` gitignore rule, so it never entered the index - the test build
      # passed on dev trees (file on disk) and broke on every clean checkout.
      # Every include_bytes!/include_str! literal path must be tracked by git.
      - name: fixture tracking gate
        run: bash scripts/check_fixtures.sh
      - name: fp-chain coverage gate (pool #58)
        run: bash scripts/check_fp_chain.sh
      - name: profile boundary gate (WP1 I1)
        run: bash scripts/check_profile_boundary.sh
      # The test steps run through scripts/test_zero_on_alloc.sh, which preloads
      # jemalloc with MALLOC_CONF=zero:true so uninitialized reads surface
      # deterministically (fresh memory reads as 0 instead of stale heap residue).
      - name: Install jemalloc (zero-on-alloc test wrapper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjemalloc2
      - name: Tests
        run: bash scripts/test_zero_on_alloc.sh --all-targets --no-fail-fast
      - name: Tests (all features)
        run: bash scripts/test_zero_on_alloc.sh --all-targets --all-features --no-fail-fast
      # Test-hygiene debt payoff (pool §46, 2026-10-21): the no-default-features
      # test face compiles and runs (was ~796 compile errors). Expected-red
      # manifest: EMPTY again (2026-10-31 — the I12 pin landed red and turned
      # green the same day, renamed to tests/tx_key_images_wallet2_view.rs).
      # `always()` keeps the step running regardless of earlier step
      # outcomes.
      - name: Tests (no default features)
        if: always()
        run: bash scripts/test_zero_on_alloc.sh --no-default-features --all-targets --no-fail-fast
      # Audit #15 P1-02: each diagnostic feature must build on its own (host).
      # Note: a host build with --no-default-features is not a supported
      # configuration (the no_std library's panic_handler collides with the
      # host's std); the stub build is exercised on the thumb target below,
      # which is where the C host actually links it.
      - name: Feature matrix (host)
        run: |
          for f in device-timing generator-cache-ffi perf-bench-ffi prove-timing-ffi cn-timing-ffi tx-phase-timing-ffi; do
            echo "::group::--features $f"
            cargo check --features "$f"
            echo "::endgroup::"
          done
      # Platform switch (2026-09-23): the production carrier is LuckyFox Pico Mini
      # (Linux/POSIX, armv7). The per-commit standard gate
      # (`cargo check --target armv7-unknown-linux-gnueabihf`) is enforced here with
      # cross-target lint: c_char is u8 on ARM, so pointer-cast lints surface only on
      # this target (the same class the flux-crate gate below caught historically).
      - name: LuckyFox gate (armv7-unknown-linux-gnueabihf)
        run: cargo clippy --all-targets --target armv7-unknown-linux-gnueabihf -- -D warnings
      - name: Embedded checks (thumbv7em)
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo check --lib --no-default-features --target thumbv7em-none-eabihf
          cargo check --lib --no-default-features --target thumbv7em-none-eabihf \
            --features device-timing,generator-cache-ffi,prove-timing-ffi,cn-timing-ffi,tx-phase-timing-ffi,perf-bench-ffi
      - name: Vendor crate tests (timing hooks)
        run: cd vendor/cryptonight && cargo test --features cn-timing --lib
      # Z5.3 test-infra (2026-10-21): the vendored bulletproofs' own suite is
      # the non-pow2 proof-correctness reference oracle (m=1..16 prove+verify).
      - name: Vendor crate tests (bulletproofs reference oracle)
        run: cd vendor/monero-bulletproofs && cargo test --release

  zero-heap:
    name: Zero-heap (Z6 allocation face)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: probes/noalloc
      # The zero-heap claim has two faces and they are measured separately
      # (probes/noalloc/README.md): the graph face below, and the reachable
      # face in the next step. Both must stay green - a green reachable face
      # with an alloc-linked graph would mean the production shape is drifting.
      # Guarded in CI because the probe only ran in the local gate batch
      # before: a regression could reach main without any CI signal.
      - name: Graph face (the crate graph links without an allocator)
        run: bash scripts/z6_langitem_check.sh
      # Probes build a bare-metal staticlib in the PRODUCTION shape (no
      # alloc-fallback, no #[global_allocator]) and link it against a C main,
      # so any allocation reachable from the signing entry breaks the link
      # with an undefined `__rust_alloc*`. measure.py then disassembles the
      # linked ELF and proves no code reachable from `z6_probe_run` calls the
      # allocator. build.sh exits 0 = REACHABLE-CLEAN, 10 = reachable debt.
      - name: Allocation face (build + link + disassembly)
        run: |
          # The Ubuntu mirror flakes (run 43042531362: "Temporary failure resolving
          # 'security.ubuntu.com'"), and a single DNS hiccup must not read as an
          # allocation-face regression. Retry, then fail loudly if it really is down.
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi && break
            echo "apt attempt ${attempt} failed; retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
            if [ "${attempt}" = "3" ]; then
              echo "apt is unavailable after 3 attempts - this is infrastructure, not the allocation face" >&2
              exit 1
            fi
          done
          bash probes/noalloc/build.sh
      - name: Upload allocation-face receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z6-noalloc-report
          path: probes/noalloc/z6_report.json

  fuzz-smoke:
    name: Fuzz smoke (4 targets x 30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # fuzz_run.sh 内部固定 nightly-2026-05-22(RUSTUP_TOOLCHAIN 覆盖),
      # rustup 会按需自动安装该工具链
      - name: Run smoke
        run: bash scripts/fuzz_run.sh 30

  # S2/B-8 (G17): the keystone SDK is the parser real wallets use, and it is
  # strict. This job decodes artifacts the device actually produces and asserts
  # the fields a wallet needs. Separate job on purpose: an npm hiccup must not
  # drag the Rust gates down, and vice versa.
  sdk-gate:
    name: Keystone SDK gate (what a wallet can actually parse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/sdk-gate/package-lock.json
      - name: Install gate dependencies
        run: npm ci --prefix tools/sdk-gate
      - name: Dump the artifacts the device produces
        # No --offline here: a fresh runner has no registry cache (every other
        # step in this workflow leaves it off too; --offline is the local
        # convention where the cache is warm).
        run: cargo run --quiet --example dump_sdk_artifacts -- /tmp/sdk_artifacts
      - name: Decode them with the SDK
        run: node tools/sdk-gate/run.mjs /tmp/sdk_artifacts

  appearances:
    name: Flux (clean-checkout shims + hosts + gates)
    runs-on: ubuntu-latest
    # A pathological apt mirror once turned this job into an hour of silence.
    # Fail visibly instead: the real work here is ~3 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf,thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Audit #16 P1-01: workspace default-members is the root package only,
      # so the two embedded shims and pico2 were outside every CI gate (the
      # `test` job above builds default members with no --target). This job
      # compiles each flux crate from a clean checkout and runs the C-host
      # gates (keep table, header sync) outside the full forgebox build.
      # Audit #16 P2-01: shim checks pin explicit embedded targets; a hosted
      # build of the forgebox shim is rejected by its build.rs with a clear
      # error instead of a cryptic critical-section feature collision.
      # Audit #16 P2-02: this job *is* the clean-checkout rebuild - ignored
      # build products from a developer tree can never reach it.
      # Z3.3b/c (2026-09-25): the C-ABI workspace refactor touched the FORGEBOX
      # C side (smoke_task.c / product_task.c provision ws buffers). The staticlib
      # check below never compiled that C code, so the full image build now runs
      # here too - the C callers are CI-covered like sim_l3.c already was.
      - name: C-ABI keep table gate
        run: python3 scripts/gen_ffi_keep.py --check
      - name: C header sync gate (pinned cbindgen)
        run: |
          cargo install cbindgen --version 0.27.0 --locked
          bash scripts/check_header.sh
      - name: vendor baseline replay gate (T-12 zero-residue)
        run: bash scripts/vendor_baseline_check.sh
      - name: flux keysource (host tests + no-alloc embedded face)
        run: |
          cargo test -p shlosilo-flux-keysource
          cargo check -p shlosilo-flux-keysource --no-default-features --target thumbv7em-none-eabihf
      - name: forgebox staticlib (embedded, thumbv7em)
        run: cargo check -p shlosilo-forgebox --release --target thumbv7em-none-eabihf
      # The C firmware build is ~95% of this job's wall time (measured: 3433 s of
      # a 59-minute run, every other step together ~2 minutes). Cache the compiler
      # objects: ccache keys on the preprocessed source + compiler binary + flags,
      # so a toolchain bump misses automatically and a Rust-only or docs-only push
      # pays seconds instead of an hour. build.sh routes C/ASM through ccache as
      # the CMake compiler launcher whenever it is on PATH.
      # A cache is an optimisation, never a gate: ccache-action installs ccache
      # through apt, and a runner whose package mirror is unreachable turned that
      # into a red job while every build step behind it was skipped (run
      # 43042531362: "Failed to install ccache via package manager", after the apt
      # mirror stopped resolving). build.sh only routes through ccache when it is on
      # PATH, so without it the build still runs - just uncached.
      - name: ccache (MH1903 C objects)
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: forgebox-arm-none-eabi
          max-size: 2G
      # The Ubuntu mirror is the slowest thing in this repo's CI: `apt-get update`
      # took 64 minutes on run 42195165186, and while skipping the update got one
      # run down to 54 seconds, the package download itself then took 20+ minutes
      # on run 42209596183. So the toolchain comes from a pinned upstream tarball
      # (GitHub-hosted asset, checksum-verified) and is cached; apt is not in this
      # job's path at all. Version pinned to 14.2.1 to match what the mirror was
      # installing, so a green CI still means the same compiler as a local build.
      - name: ARM GNU toolchain (pinned tarball, cached)
        id: armtc
        uses: actions/cache@v4
        with:
          path: ~/gnu-arm
          key: xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64
      - name: Fetch the ARM GNU toolchain when the cache missed
        if: steps.armtc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/armtc.tar.gz "$url"
          curl -fsSL --retry 3 -o /tmp/armtc.tar.gz.sha "$url.sha"
          echo "$(awk '{print $1}' /tmp/armtc.tar.gz.sha)  /tmp/armtc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/gnu-arm"
          tar -xzf /tmp/armtc.tar.gz -C "$HOME/gnu-arm" --strip-components=1
      - name: forgebox full image (MH1903 C host, smoke/product callers)
        run: |
          export PATH="$HOME/gnu-arm/bin:$PATH"
          echo "$HOME/gnu-arm/bin" >> "$GITHUB_PATH"
          # build.sh asserts the pinned toolchain identity when STRICT=1.
          export SHLOSILO_ARM_TOOLCHAIN="$HOME/gnu-arm"
          export SHLOSILO_ARM_TOOLCHAIN_STRICT=1
          make forgebox
          # The signed forgebox.bin needs the local forgebox CLI + signing key
          # (dev machine only); CI asserts the PRE-SIGN image instead - the C
          # compile/link of the smoke/product callers is what this gate covers.
          ls -la flux/forgebox/build/mh1903_full.bin
      - name: host-sim (POSIX) staticlib + keep gate + link + run
        run: |
          make host-sim
          ./flux/host-sim/sim_l3 | tee /tmp/sim_l3.log
          grep -q "signed tx (111 bytes)" /tmp/sim_l3.log
          grep -q "=== all steps completed ===" /tmp/sim_l3.log
      # Lint the appearance crates on their real targets. They are workspace
      # members but NOT default members (the workspace root is itself a
      # package, so default-members = the root alone), which kept them out of
      # the `test` job's clippy gates; and the embedded targets have their
      # own lint surface (c_char is u8 on both ARM targets, so cross-target
      # pointer casts lint differently than on the host - the first run of
      # this gate found exactly that class in forms/ffi/c_abi.rs). pico2 is
      # linted with --all-features to cover the bench/perf surface.
      - name: "Flux crates: clippy (embedded + host targets, warnings denied)"
        run: |
          cargo clippy -p shlosilo-pico2 --release --target thumbv8m.main-none-eabihf --all-features -- -D warnings
          cargo clippy -p shlosilo-forgebox --release --target thumbv7em-none-eabihf -- -D warnings
          cargo clippy -p shlosilo-host-sim --release -- -D warnings
      - name: pico2 image + UF2 pack (thumbv8m)
        run: |
          # elf2uf2-rs pulls in libudev-sys for USB autodetect; the runner
          # image does not ship the dev package (local dev machines have it).
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev
          cargo install elf2uf2-rs --version 2.2.0 --locked
          make pico2-uf2
          ls -la target/thumbv8m.main-none-eabihf/release/shlosilo-pico2.uf2
      # Audit #17 P1-01: the fixed-entropy XMR command (xmrseed), the
      # test-vector mnemonic loader (entropy) and the TRNG diagnostics are
      # bench-only; production images must not contain them. Builds both
      # flavors and asserts the absence/presence split (with a positive
      # control on the bench build).
      - name: pico2 build flavors (fixed entropy is bench-only)
        run: bash scripts/check_pico2_flavors.sh
